services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_NAME:-secure_repos}
            MYSQL_USER: ${DB_USER:-secure_repos}
            MYSQL_PASSWORD: ${DB_PASS:-secure_repos_password}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-secure_repos_root_password}
        ports:
            - '${DB_PORT:-3306}:3306'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 10s
            timeout: 5s
            retries: 10

    app:
        build: .
        depends_on:
            mysql:
                condition: service_healthy
        env_file:
            - .env
        environment:
            DB_HOST: mysql
            DB_PORT: 3306
            NODE_ENV: development
            PORT: 3000
        ports:
            - '${PORT:-3000}:3000'
        command: sh -c "npm run db:migrate && npm start"

volumes:
    mysql-data:
