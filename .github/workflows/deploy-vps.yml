name: CI and VPS deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=package-lock.json

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Install SSH password client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_RESTART_COMMAND: ${{ secrets.VPS_RESTART_COMMAND }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?VPS_HOST secret is required}"
          : "${VPS_USER:?VPS_USER secret is required}"
          : "${VPS_PASSWORD:?VPS_PASSWORD secret is required}"
          : "${VPS_APP_DIR:?VPS_APP_DIR secret is required}"

          SSH_PORT="${VPS_PORT:-22}"
          RESTART_COMMAND="${VPS_RESTART_COMMAND:-npm run pm2:reload}"

          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             cd '$VPS_APP_DIR'
             git fetch origin main
             git pull --ff-only origin main
             npm ci
             npm run build
             npx sequelize-cli db:migrate
             $RESTART_COMMAND"
